name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q

  gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Capture baseline
        run: python -m tracegate.cli baseline scenarios/example.yaml -o baseline.json
      - name: Verify known-good agent passes the gate
        run: python -m tracegate.cli gate scenarios/example.yaml -b scenarios/behavior_good.yaml -r baseline.json
