[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegate"
version = "0.1.0"
description = "Deterministic, mutation-validated regression infrastructure for agentic pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "suhas" }]
keywords = ["agent", "evaluation", "regression", "llm", "trajectory", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/suhas018/Trace_Gate"
Repository = "https://github.com/suhas018/Trace_Gate"
Issues = "https://github.com/suhas018/Trace_Gate/issues"

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
ollama = ["langgraph>=0.2", "langchain-ollama>=0.2", "langchain-core>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
tracegate = "tracegate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
