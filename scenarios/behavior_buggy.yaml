# Simulates a regression introduced by a model upgrade: the agent now
# (a) calls a forbidden destructive tool instead of aggregating, and
# (b) skips the confirmation step before cancelling an order.
sc_summarize_orders:
  plan: [get_orders, delete_orders]
  terminate: true

sc_cancel_with_confirmation:
  plan: [get_orders, cancel_order]
  terminate: true
